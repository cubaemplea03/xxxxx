workflows:
  android-debug:
    name: Último Tren - Android Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.ultimotren.vjrxqp"
      java: 17

    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Install Gradle 9.3.1
        script: |
          set -e
          GRADLE_VERSION="9.3.1"
          GRADLE_HOME="$CM_BUILD_DIR/.gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl -L --fail --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$CM_BUILD_DIR/gradle.zip"
            rm -rf "$GRADLE_HOME" "$CM_BUILD_DIR/gradle-${GRADLE_VERSION}"
            unzip -q "$CM_BUILD_DIR/gradle.zip" -d "$CM_BUILD_DIR"
            mv "$CM_BUILD_DIR/gradle-${GRADLE_VERSION}" "$GRADLE_HOME"
            rm -f "$CM_BUILD_DIR/gradle.zip"
          fi
          echo "GRADLE_HOME=$GRADLE_HOME" >> "$CM_ENV"
          echo "PATH=$GRADLE_HOME/bin:$PATH" >> "$CM_ENV"
          "$GRADLE_HOME/bin/gradle" --version

      - name: Prepare Secrets Gradle Plugin defaults
        script: |
          set -e
          # Codemagic/repository exports can omit hidden dot-files. The Android
          # Secrets Gradle Plugin requires .env.example to exist even for a
          # debug build, so create a safe placeholder when it is missing.
          if [ ! -f "$CM_BUILD_DIR/.env.example" ]; then
            cat > "$CM_BUILD_DIR/.env.example" <<'EOF'
# Safe build-time placeholder. Configure GEMINI_API_KEY in Codemagic
# environment variables/secrets if the app needs the Gemini API.
GEMINI_API_KEY=
EOF
          fi
          echo "Using secrets defaults: $CM_BUILD_DIR/.env.example"
          test -f "$CM_BUILD_DIR/.env.example"

      - name: Build Android debug APK
        script: |
          set -e
          "$GRADLE_HOME/bin/gradle" clean assembleDebug --stacktrace --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      scripts:
        - name: Build completed
          script: |
            echo "Último Tren APK build completed successfully."
